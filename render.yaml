services:
  - type: web
    name: iammasterheavenly-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ALLOWED_ORIGINS
        value: "https://iammasterheavenly-web.pages.dev"
      - key: LLM_MODEL
        value: "claude-opus-5-5"
      # Secrets: Render asks for these values in the dashboard (sync: false).
      - key: LLM_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
